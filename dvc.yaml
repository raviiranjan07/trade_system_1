stages:

  build_features:
    cmd: python src/engine/build_features.py
    deps:
      - data/raw/BTCUSDT_15m_ohlcv.parquet
      - src/engine/build_features.py
    outs:
      - data/features/direction_prediction/feature_cache.parquet

  build_labels:
    cmd: python experiments/layer2/L2-003/stage_3/L2_003_stage3_labels.py
    deps:
      - data/features/direction_prediction/feature_cache.parquet
      - experiments/layer2/L2-003/stage_3/L2_003_stage3_labels.py
    outs:
      - data/features/direction_prediction/labels.parquet

  train_mlp_v15:
    # Outputs go to models/ML_V1_staging/ — the live bot reads from
    # models/ML_V1/ and is unaffected until manual promotion.
    cmd: python src/engine/ml_train.py
    deps:
      - data/features/direction_prediction/feature_cache.parquet
      - data/features/direction_prediction/labels.parquet
      - src/engine/ml_train.py
    params:
      - configs/params.yaml:
          - ml_v1.training
          - ml_v1.split
    outs:
      - models/ML_V1_staging:
          cache: false

  verify_ml_v1:
    # Generic training-manifest verifier (src/mlops/verify.py) reads the
    # manifest the trainer wrote and runs checks: no split overlap, scaler
    # fit on train only, data hashes match, MLflow registration correct.
    # If any check fails, verify exits nonzero — DVC halts the pipeline,
    # backtest never runs on a bad model.
    cmd: python src/mlops/verify.py models/ML_V1_staging
    deps:
      - models/ML_V1_staging
      - src/mlops/verify.py
    outs:
      - data/reports/verification_ML_V1_staging.json:
          cache: false

  backtest_staging:
    # Backtests ML_V1 @staging on OOS window from params.yaml.
    # Depends on verification report → only runs if verify passed.
    cmd: python scripts/mlops/backtest_staging.py
    deps:
      - models/ML_V1_staging
      - data/reports/verification_ML_V1_staging.json
      - scripts/mlops/backtest_staging.py
      - src/engine/backtest.py
      - src/engine/signals/ml_v1.py
    params:
      - configs/params.yaml:
          - backtest
          - ml_v1.inference
    outs:
      - data/reports/backtest_staging_ml_v1_exitv1.json:
          cache: false
      - data/reports/backtest_staging_trades_ml_v1_exitv1.parquet:
          cache: false
      - data/reports/backtest_matrix_summary.json:
          cache: false

  verify_backtest:
    # Invariant checks on every trade — STOP_LOSS trades must be near -10,
    # PT_TARGET trades must have MFE >= 80, etc. Fails loudly if any trade
    # violates the rule that closed it. Catches the class of bug where V3
    # config is set but V3 logic doesn't actually run.
    cmd: python scripts/mlops/verify_backtest.py
    deps:
      - data/reports/backtest_staging_trades_ml_v1_exitv1.parquet
      - scripts/mlops/verify_backtest.py
    outs:
      - data/reports/verify_backtest.json:
          cache: false

  train_attention:
    # Trained on Colab T4 GPU — see scripts/colab/train_attention_production.py
    # This stage is frozen: dvc repro will not re-run it.
    cmd: echo "Trained externally. Files in models/ML_V2_ATTENTION/"
    deps:
      - data/features/direction_prediction/feature_cache.parquet
      - data/features/direction_prediction/labels.parquet
    outs:
      - models/ML_V2_ATTENTION:
          cache: false
    frozen: true

  # ================================================================
  # ML V3 Pipeline — Exit-Aware Direction Prediction
  # ================================================================

  build_exit_labels:
    cmd: python -m engine.build_exit_labels
    wdir: src
    deps:
      - ../data/raw/BTCUSDT_15m_ohlcv.parquet
      - ../data/raw/BTCUSDT_1m_ohlcv.parquet
      - engine/position_manager.py
      - engine/config/settings.yaml
      - engine/build_exit_labels.py
    outs:
      - ../data/features/direction_prediction/exit_aware_labels.parquet

  verify_exit_labels:
    cmd: python -m engine.verify_exit_labels
    wdir: src
    deps:
      - ../data/features/direction_prediction/exit_aware_labels.parquet
      - ../data/raw/BTCUSDT_15m_ohlcv.parquet
      - ../data/raw/BTCUSDT_1m_ohlcv.parquet
      - engine/verify_exit_labels.py
    outs:
      - ../data/reports/label_verification.json:
          cache: false

  train_v3:
    cmd: cmd /c "set PYTHONIOENCODING=utf-8 && python -m engine.train_v3"
    wdir: src
    deps:
      - ../data/features/direction_prediction/feature_cache.parquet
      - ../data/features/direction_prediction/exit_aware_labels.parquet
      - ../data/reports/label_verification.json
      - engine/train_v3.py
    params:
      - ../configs/params.yaml:
          - ml_v3.training
          - ml_v3.split
    outs:
      - ../models/ML_V3_staging:
          cache: false
    metrics:
      - ../data/reports/v3_train_metrics.json:
          cache: false

  verify_v3_model:
    cmd: python -m engine.verify_v3_model
    wdir: src
    deps:
      - ../models/ML_V3_staging
      - ../data/features/direction_prediction/feature_cache.parquet
      - ../data/features/direction_prediction/exit_aware_labels.parquet
      - engine/verify_v3_model.py
    outs:
      - ../data/reports/v3_model_verification.json:
          cache: false

  backtest_v3:
    cmd: cmd /c "set PYTHONPATH=src && python -m engine.backtest --model ml_v3"
    deps:
      - models/ML_V3_staging
      - data/reports/v3_model_verification.json
      - data/raw/BTCUSDT_15m_ohlcv.parquet
      - data/raw/BTCUSDT_1m_ohlcv.parquet
      - src/engine/backtest.py
      - src/engine/signals/ml_v3.py
    outs:
      - data/reports/backtest_staging_ml_v3.json:
          cache: false
      - data/reports/backtest_staging_trades_ml_v3.parquet:
          cache: false

  verify_v3_backtest:
    cmd: cmd /c "set PYTHONPATH=src && python -m engine.verify_v3_backtest"
    deps:
      - data/reports/backtest_staging_ml_v3.json
      - data/reports/backtest_staging_ml_v2_attention_exitv2.json
      - src/engine/verify_v3_backtest.py
    outs:
      - data/reports/v3_backtest_verification.json:
          cache: false

  compare_v3:
    cmd: cmd /c "set PYTHONPATH=src && python -m engine.compare_models"
    deps:
      - data/reports/backtest_staging_ml_v3.json
      - data/reports/backtest_staging_ml_v2_attention_exitv2.json
      - data/reports/v3_backtest_verification.json
      - src/engine/compare_models.py
    outs:
      - data/reports/v3_vs_v2_comparison.json:
          cache: false
