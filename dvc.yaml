stages:

  # ================================================================
  # SHARED DATA STAGES — model-agnostic, used by every model
  # ================================================================

  build_features:
    cmd: python src/training/build_features.py
    deps:
      - data/raw/BTCUSDT_15m_ohlcv.parquet
      - src/training/build_features.py
    outs:
      - data/features/direction_prediction/feature_cache.parquet

  build_exit_labels:
    cmd: python -m training.build_exit_labels
    wdir: src
    deps:
      - ../data/raw/BTCUSDT_15m_ohlcv.parquet
      - ../data/raw/BTCUSDT_1m_ohlcv.parquet
      - engine/position_manager.py
      - engine/config/settings.yaml
      - training/build_exit_labels.py
    outs:
      - ../data/features/direction_prediction/exit_aware_labels.parquet

  verify_exit_labels:
    cmd: python -m training.verify_exit_labels
    wdir: src
    deps:
      - ../data/features/direction_prediction/exit_aware_labels.parquet
      - ../data/raw/BTCUSDT_15m_ohlcv.parquet
      - ../data/raw/BTCUSDT_1m_ohlcv.parquet
      - training/verify_exit_labels.py
    outs:
      - ../data/reports/label_verification.json:
          cache: false

  # ================================================================
  # PER-MODEL CHAIN TEMPLATE
  # (full 18-stage reference: archive/dvc_3model_pipeline.yaml)
  #
  # train_<model>:
  #   cmd: cmd /c "set PYTHONPATH=src && set PYTHONIOENCODING=utf-8 && python -m training.train --model <model>"
  #   deps: feature cache + labels + train.py/training_utils.py/
  #         architectures.py/feature_lib.py
  #   params: configs/params.yaml -> <model>.training/.split/.features
  #   outs (cache: false): models/<MODEL>_staging
  #
  # verify_<model>:
  #   cmd: python src/mlops/verify.py models/<MODEL>_staging
  #   outs (cache: false): data/reports/verification_<MODEL>_staging.json
  #
  # backtest_<model>:
  #   cmd: cmd /c "set PYTHONPATH=src && python -m research.backtest --model <model> --exit-version <v> --start <test_start> --end <test_end>"
  #   deps: staging model + verification json + raw parquets +
  #         research/backtest.py + the model's signal adapter
  #   params: <model>.inference/.features
  #   outs (cache: false): data/reports/<model>/backtest.json + trades.parquet
  # ================================================================
