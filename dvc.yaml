stages:

  build_features:
    cmd: python src/engine/build_features.py
    deps:
      - data/raw/BTCUSDT_15m_ohlcv.parquet
      - src/engine/build_features.py
    outs:
      - data/features/direction_prediction/feature_cache.parquet

  build_labels:
    cmd: python experiments/layer2/L2-003/stage_3/L2_003_stage3_labels.py
    deps:
      - data/features/direction_prediction/feature_cache.parquet
      - experiments/layer2/L2-003/stage_3/L2_003_stage3_labels.py
    outs:
      - data/features/direction_prediction/labels.parquet

  train_mlp_v15:
    # Outputs go to models/direction_v15_staging/ — the live bot reads from
    # models/direction_v15/ and is unaffected until manual promotion.
    cmd: python src/engine/ml_train.py
    deps:
      - data/features/direction_prediction/feature_cache.parquet
      - data/features/direction_prediction/labels.parquet
      - src/engine/ml_train.py
    outs:
      - models/direction_v15_staging:
          cache: false

  train_attention:
    # Trained on Colab T4 GPU — see scripts/colab/train_attention_production.py
    # This stage is frozen: dvc repro will not re-run it.
    cmd: echo "Trained externally on Colab. Files placed manually in models/direction_attention/"
    deps:
      - data/features/direction_prediction/feature_cache.parquet
      - data/features/direction_prediction/labels.parquet
    outs:
      - models/direction_attention:
          cache: false
    frozen: true
