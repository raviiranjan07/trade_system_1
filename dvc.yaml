stages:

  # ================================================================
  # SHARED — used by all models
  # ================================================================

  build_features:
    cmd: python src/engine/build_features.py
    deps:
      - data/raw/BTCUSDT_15m_ohlcv.parquet
      - src/engine/build_features.py
    outs:
      - data/features/direction_prediction/feature_cache.parquet

  # ================================================================
  # V1.4 (rule-based, no ML)
  # ================================================================

  backtest_v14:
    cmd: cmd /c "set PYTHONPATH=src && python -m engine.backtest --v14-only --exit-version v1"
    deps:
      - data/raw/BTCUSDT_15m_ohlcv.parquet
      - data/raw/BTCUSDT_1m_ohlcv.parquet
      - src/engine/backtest.py
      - src/engine/strategy.py
    outs:
      - data/reports/v14/backtest.json:
          cache: false
      - data/reports/v14/trades.parquet:
          cache: false

  # ================================================================
  # ML_V1 (MLP)
  # ================================================================

  build_labels:
    cmd: python experiments/layer2/L2-003/stage_3/L2_003_stage3_labels.py
    deps:
      - data/features/direction_prediction/feature_cache.parquet
      - experiments/layer2/L2-003/stage_3/L2_003_stage3_labels.py
    outs:
      - data/features/direction_prediction/labels.parquet

  train_ml_v1:
    cmd: python src/engine/ml_train.py
    deps:
      - data/features/direction_prediction/feature_cache.parquet
      - data/features/direction_prediction/labels.parquet
      - src/engine/ml_train.py
    params:
      - configs/params.yaml:
          - ml_v1.training
          - ml_v1.split
    outs:
      - models/ML_V1_staging:
          cache: false

  verify_ml_v1:
    cmd: python src/mlops/verify.py models/ML_V1_staging
    deps:
      - models/ML_V1_staging
      - src/mlops/verify.py
    outs:
      - data/reports/verification_ML_V1_staging.json:
          cache: false

  backtest_ml_v1:
    cmd: cmd /c "set PYTHONPATH=src && python -m engine.backtest --model ml_v1 --independent --exit-version v1"
    deps:
      - models/ML_V1_staging
      - data/reports/verification_ML_V1_staging.json
      - data/raw/BTCUSDT_15m_ohlcv.parquet
      - data/raw/BTCUSDT_1m_ohlcv.parquet
      - src/engine/backtest.py
      - src/engine/signals/ml_v1.py
    params:
      - configs/params.yaml:
          - ml_v1.inference
    outs:
      - data/reports/ml_v1/backtest.json:
          cache: false
      - data/reports/ml_v1/trades.parquet:
          cache: false

  # ================================================================
  # ML_V2 ATTENTION (frozen training — trained on Colab)
  # ================================================================

  train_attention:
    cmd: echo "Trained externally. Files in models/ML_V2_ATTENTION/"
    deps:
      - data/features/direction_prediction/feature_cache.parquet
      - data/features/direction_prediction/labels.parquet
    outs:
      - models/ML_V2_ATTENTION:
          cache: false
    frozen: true

  backtest_ml_v2:
    cmd: cmd /c "set PYTHONPATH=src && python -m engine.backtest --model ml_v2_attention --independent --exit-version v1"
    deps:
      - models/ML_V2_ATTENTION
      - data/raw/BTCUSDT_15m_ohlcv.parquet
      - data/raw/BTCUSDT_1m_ohlcv.parquet
      - src/engine/backtest.py
      - src/engine/signals/direction_attention.py
    params:
      - configs/params.yaml:
          - ml_v2_attention.inference
    outs:
      - data/reports/ml_v2_attention/backtest.json:
          cache: false
      - data/reports/ml_v2_attention/trades.parquet:
          cache: false

  # ================================================================
  # ML_V3 (exit-aware labels + snapshot features)
  # ================================================================

  build_exit_labels:
    cmd: python -m engine.build_exit_labels
    wdir: src
    deps:
      - ../data/raw/BTCUSDT_15m_ohlcv.parquet
      - ../data/raw/BTCUSDT_1m_ohlcv.parquet
      - engine/position_manager.py
      - engine/config/settings.yaml
      - engine/build_exit_labels.py
    outs:
      - ../data/features/direction_prediction/exit_aware_labels.parquet

  verify_exit_labels:
    cmd: python -m engine.verify_exit_labels
    wdir: src
    deps:
      - ../data/features/direction_prediction/exit_aware_labels.parquet
      - ../data/raw/BTCUSDT_15m_ohlcv.parquet
      - ../data/raw/BTCUSDT_1m_ohlcv.parquet
      - engine/verify_exit_labels.py
    outs:
      - ../data/reports/label_verification.json:
          cache: false

  train_v3:
    cmd: cmd /c "set PYTHONIOENCODING=utf-8 && python -m engine.train_v3"
    wdir: src
    deps:
      - ../data/features/direction_prediction/feature_cache.parquet
      - ../data/features/direction_prediction/exit_aware_labels.parquet
      - ../data/reports/label_verification.json
      - engine/train_v3.py
    params:
      - ../configs/params.yaml:
          - ml_v3.training
          - ml_v3.split
    outs:
      - ../models/ML_V3_staging:
          cache: false
    metrics:
      - ../data/reports/v3_train_metrics.json:
          cache: false

  verify_v3_model:
    cmd: python -m engine.verify_v3_model
    wdir: src
    deps:
      - ../models/ML_V3_staging
      - ../data/features/direction_prediction/feature_cache.parquet
      - ../data/features/direction_prediction/exit_aware_labels.parquet
      - engine/verify_v3_model.py
    outs:
      - ../data/reports/v3_model_verification.json:
          cache: false

  sweep_thresholds_ml_v3:
    cmd: cmd /c "set PYTHONPATH=src && python -m engine.sweep_thresholds --model ml_v3"
    deps:
      - models/ML_V3_staging
      - data/reports/v3_model_verification.json
      - data/raw/BTCUSDT_15m_ohlcv.parquet
      - data/raw/BTCUSDT_1m_ohlcv.parquet
      - src/engine/sweep_thresholds.py
    params:
      - configs/params.yaml:
          - ml_v3.sweep
    outs:
      - data/reports/ml_v3/threshold_sweep.json:
          cache: false

  backtest_ml_v3:
    cmd: cmd /c "set PYTHONPATH=src && python -m engine.backtest --model ml_v3 --independent --exit-version v1"
    deps:
      - models/ML_V3_staging
      - data/reports/v3_model_verification.json
      - data/raw/BTCUSDT_15m_ohlcv.parquet
      - data/raw/BTCUSDT_1m_ohlcv.parquet
      - src/engine/backtest.py
      - src/engine/signals/ml_v3.py
    params:
      - configs/params.yaml:
          - ml_v3.inference
    outs:
      - data/reports/ml_v3/backtest.json:
          cache: false
      - data/reports/ml_v3/trades.parquet:
          cache: false

  # ================================================================
  # COMPARE ALL (reads all independent backtest results)
  # ================================================================

  compare_all:
    cmd: cmd /c "set PYTHONPATH=src && python -m engine.compare_models"
    deps:
      - data/reports/ml_v1/backtest.json
      - data/reports/ml_v2_attention/backtest.json
      - data/reports/ml_v3/backtest.json
      - data/reports/v14/backtest.json
      - src/engine/compare_models.py
    outs:
      - data/reports/comparison.json:
          cache: false
