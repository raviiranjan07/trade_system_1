# ALPHA Trading Bot Configuration
# Config hash ensures reproducibility across runs

# --- Shared market indicators (consumed by all tracks + dashboard) ---
# NOTE: atr_rolling_window=200 here vs 500 in the training feature cache —
# known train-vs-live drift for ML V3's snapshot, frozen deliberately.
# See engine/signals/feature_lib.py docstring. Resolve at next retrain.
indicators:
  rsi_period: 14
  sma_period: 200        # SMA200 for bull/bear regime
  ema_short: 50          # EMA50 for separation calc
  ema_long: 200          # EMA200 for separation calc
  atr_period: 14
  atr_rolling_window: 200   # percentile calculated over 200 bars

# --- Exit Mechanics (V1: PT/MID_TRAIL/LOCKED_PROFIT/STOP_LOSS) ---
# See configs/strategy_cards/exit_v1.yaml for full rule docs.
exit:
  v1_max_bars: 6
  v1_pt_arm_bps: 60
  v1_pt_target_bps: 80
  v1_pt_lock_bps: 60
  v1_pt_max_bar: 5
  v1_mid_trail_arm_bps: 25
  v1_mid_trail_width_bps: 10
  v1_lock_arm_bps: 15
  v1_lock_trigger_bps: 15
  v1_stop_loss_bps: -10

# --- Execution ---
execution:
  mode: paper          # paper | live
  leverage: 125        # must match risk/exchange_constants.LEVERAGE (margin/liq math)
  position_size_usd: 10
