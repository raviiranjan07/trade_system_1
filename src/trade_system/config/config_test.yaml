# =============================================================================
# Trading System Configuration - TESTING
# =============================================================================
# Use this file for backtesting experiments.
# Production config (live/paper trading) is in config.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Data Settings
# -----------------------------------------------------------------------------
data:
  # Trading pair (e.g., BTCUSDT, ETHUSDT)
  pair: "BTCUSDT"

  # Timeframe for candles
  timeframe: "1m"

  # Date range for data fetching (ISO format: YYYY-MM-DD)
  start_date: "2020-01-01"
  end_date: "2025-12-31"

  # Database connection (can be overridden by DATABASE_URL env var)
  # For remote connection, set DATABASE_URL in .env file
  database_url: "postgresql://localhost/crypto_data"

  # Gap handling for missing candles
  max_gap_tolerance: 5000       # Max missing candles allowed (0 = strict)
  fill_small_gaps: false     # Auto-fill gaps <= 100 candles with forward-fill

# -----------------------------------------------------------------------------
# Feature Engineering
# -----------------------------------------------------------------------------
features:
  # EMA periods for trend detection
  ema_fast_period: 50
  ema_slow_period: 200

  # Momentum indicators
  rsi_period: 14
  return_periods:
    - 5   # 5-minute returns
    - 15  # 15-minute returns

  # Volatility
  atr_period: 14

  # Location features
  range_lookback: 50  # bars for high/low range

# -----------------------------------------------------------------------------
# State Vector Normalization
# -----------------------------------------------------------------------------
normalization:
  # Rolling window for z-score and percentile calculations
  window: 2000

# -----------------------------------------------------------------------------
# Regime Detection
# -----------------------------------------------------------------------------
regime:
  # Volatility thresholds (percentile-based)
  high_vol_threshold: 0.85      # Above this = HIGH_VOL regime
  low_vol_threshold: 0.35       # Below this = LOW_VOL variant

  # Trend strength threshold (z-score based)
  trend_strength_threshold: 0.7

  # Smoothing window for regime labels
  smoothing_window: 30

# -----------------------------------------------------------------------------
# Outcome Labeling
# -----------------------------------------------------------------------------
outcomes:
  # Forward-looking horizons (in bars/minutes)
  horizons:
    - 5    # 5-minute outcomes
    - 10   # 10-minute outcomes
    - 15   # 15-minute outcomes
    - 30   # 30-minute outcomes
    - 120  # 2-hour outcomes

# -----------------------------------------------------------------------------
# Similarity Engine (KNN)
# -----------------------------------------------------------------------------
similarity:
  # Number of nearest neighbors
  k: 200

  # Default horizon for queries (must match one of outcomes.horizons)
  default_horizon: 5

  # Maximum distance threshold (reject if too dissimilar)
  max_distance: 3.0

  # Backend selection: "bruteforce" or "faiss"
  backend: "bruteforce"

  # FAISS-specific settings (only used when backend: "faiss")
  faiss_nlist: 100
  faiss_nprobe: 10

# -----------------------------------------------------------------------------
# Decision Engine
# -----------------------------------------------------------------------------
decision:
  # Account settings
  capital: 100        # Starting capital in USD (matches BEST_PARAMS.yaml)
  risk_per_trade: 0.005   # Risk 0.5% per trade

  # Position limits
  max_leverage: 1.0       # Maximum leverage multiplier

  # Trade filters (from BEST_PARAMS.yaml)
  min_expectancy: 0.001   # Best value from grid search (100% WR, zero drawdown)
  max_distance: 3.0       # Maximum avg distance to neighbors

  # Regimes to avoid trading (set to [] to trade all regimes)
  blocked_regimes: []     # No blocking - best for 5m horizon

# -----------------------------------------------------------------------------
# Pipeline Settings
# -----------------------------------------------------------------------------
pipeline:
  # Which stages to run (can disable for partial runs)
  stages:
    state_vectors: true
    regime_labeling: true
    outcome_labeling: true
    similarity: true
    decision: true

  # Parallel processing (future use)
  n_jobs: 1

# -----------------------------------------------------------------------------
# Output Paths
# -----------------------------------------------------------------------------
paths:
  # Base directory for all data outputs
  data_dir: "data"

  # Subdirectories (relative to data_dir)
  state_vectors_dir: "state_vectors"
  regimes_dir: "regimes"
  outcomes_dir: "outcomes"

  # Log directory
  logs_dir: "logs"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: "INFO"           # DEBUG, INFO, WARNING, ERROR
  console_output: true
  file_output: true
  log_file: "pipeline.log"

# -----------------------------------------------------------------------------
# Backtesting
# -----------------------------------------------------------------------------
backtest:
  # Train/test split - FOR TESTING: Use 70/30 split
  train_ratio: 0.70               # Use first 70% for training, 30% for testing

  # Execution settings
  slippage_pct: 0.0005            # 0.05% slippage per trade
  commission_pct: 0.0004          # 0.04% commission (taker fee)

  # Trade management
  max_bars_in_trade: 0             # 0 = no timeout (best backtest results)

  # Trailing stop settings
  trailing_stop_pct: 0.0          # Disabled
  trailing_stop_activation_pct: 0.0

  # Performance optimization
  sample_interval: 5              # EXPERIMENT: Real-time signal checking (every bar)
                                  # Testing si=1 + min_exp=0.001 combination

  # Output
  save_trades: true               # Save trade log to parquet
  output_dir: "backtest"          # Subdirectory for backtest results
