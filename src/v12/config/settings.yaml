# V1.3 Trading Bot Configuration
# Every parameter traced to experiment source
# Config hash ensures reproducibility across runs

# --- Signal Generation (EXP-001: V1 original) ---
strategy:
  rsi_period: 14
  rsi_oversold: 20       # RSI < 20 = oversold signal
  rsi_overbought: 80     # RSI > 80 = overbought signal
  sma_period: 200        # SMA200 for bull/bear market regime

# --- LONG Filters (EXP-006: WHEN analysis) ---
long_filters:
  atr_period: 14
  atr_rolling_window: 200     # percentile calculated over 200 bars
  atr_percentile_min: 25      # skip LONG when ATR < 25th percentile
  ema_short: 50               # EMA50 for separation calc
  ema_long: 200               # EMA200 for separation calc
  ema_separation_min: 0.5     # skip LONG when EMA sep < 0.5%

# --- SHORT Filters (EXP-007: ALL filters REJECTED) ---
short_filters:
  enabled: false  # SHORT is robust in all conditions — do not filter

# --- BEAR_LONG Filters (EXP-013: counter-trend LONG in bear market) ---
bear_long_filters:
  rsi_threshold: 10          # RSI < 10 = extreme oversold in bear
  ema_separation_min: 1.0    # only when EMAs separated by 1%+

# --- BULL_SHORT Filters (EXP-013: counter-trend SHORT in bull market) ---
bull_short_filters:
  rsi_threshold: 90          # RSI > 90 = extreme overbought in bull
  atr_percentile_min: 60     # only in high volatility (60th+ percentile)
  ema_separation_min: 1.0    # only when EMAs separated by 1%+

# --- Exit Mechanics ---
# V2 params (used by V1.4 RSI and ML V2 Attention)
# V3 params (used by ML V1.5 MLP only) — proposed, see exit_v3.yaml
exit:
  # V2 params
  long_trailing_stop_bps: 20
  short_trailing_stop_bps: 30
  max_bars: 10
  tighten_after_bar: 4
  tight_trailing_stop_bps: 6
  early_cut_bar3_mfe: 3
  early_cut_bar4_mfe: 5
  breakeven_activation_mfe: 15
  breakeven_floor_gross_bps: 9

  # V3 params (ML V1.5)
  v3_max_bars: 6
  v3_pt_arm_bps: 60
  v3_pt_target_bps: 80
  v3_pt_lock_bps: 60
  v3_pt_max_bar: 5
  v3_mid_trail_arm_bps: 25
  v3_mid_trail_width_bps: 10
  v3_lock_arm_bps: 15
  v3_lock_trigger_bps: 15

# --- Re-entry (EXP-012: Config A+RE validated) ---
reentry:
  enabled: false
  max_reentries: 1    # 1 re-entry per original signal
  cooldown_bars: 2    # wait 2 bars after trailing stop exit

# --- Execution ---
execution:
  mode: paper          # paper | live
  leverage: 20
  position_size_usd: 10
