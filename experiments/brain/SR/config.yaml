# Stage 2: S/R Level Memory — Configuration
# All thresholds and parameters in one place

sr_detection:
  method: hybrid_kde              # options: biggest_gap, plain_kde, hybrid_kde
  lookback: 25                    # bars for S/R zone detection
  bandwidth: 0.03                 # KDE bandwidth (tested 0.01-0.15, 0.03 best for BTC 15m)
  support_weight: reaction        # options: plain, recency, reaction, combined
  resistance_weight: recency      # options: plain, recency, reaction, combined
  peak_threshold: 0.2             # minimum peak height (% of max density)
  carry_forward: true             # use previous zone if none found

zone_filter:
  touch_threshold: 0.2            # normalized: dist_to_zone / zone_width <= this = touch
  zone_width_min: 30              # bps — minimum zone width
  touch_mode: every_bar           # options: every_bar, entry_only

zone_registry:
  # MFE tracking
  mfe_horizon: 25                 # bars to measure MFE after touch (configurable per asset)

  # Matching
  tolerance_alpha: 0.001          # price-based tolerance floor (10bps)
  drift_smoothing: 0.9            # center update: 0.9 * old + 0.1 * new
  drift_cap: 0.5                  # max drift as fraction of original width

  # Death
  death_break_distance: 50        # bps — zone broken if price crosses by this much
  death_consecutive_breaks: 3     # zone dies after N consecutive breaks
  death_stale_bars: 100           # zone dies after N bars without touch

  # Role flip
  role_flip_alpha: 0.3            # threshold = max(alpha * zone_width, tolerance_alpha * price)

  # Touch spacing
  min_touch_gap: 5                # bars — minimum gap between touches at same zone

memory:
  # Bayesian smoothing
  bayesian_prior_num: 1           # bounce_ratio = (bounces + prior_num) / (touches + prior_den)
  bayesian_prior_den: 2

  # Recent history
  recent_history_size: 5          # last N touches for recent_bounce/break_ratio
  max_history: 10                 # deque maxlen for full history

  # Pressure
  pressure_min_touches: 3         # pressure = 0 if touches < this

label:
  horizon: 25                     # bars ahead for MFE/MAE
  bounce_threshold: 0.70          # favorable_pct > this = BOUNCE
  break_threshold: 0.70           # adverse_pct > this = BREAK
  min_move_bps: 15                # minimum favorable/adverse move in bps
  # CHOP = neither threshold met OR move < min_move_bps

features:
  clip_range: 3                   # clip zone-relative features to [-clip, +clip]
  snapshot_count: 25              # bars per sample

model:
  lstm_hidden: 64
  dense_hidden: 32
  dropout: 0.2
  num_classes: 3                  # bounce, break, chop

training:
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 100
  patience: 15

data:
  train: ["2020-01-01", "2022-11-30"]
  val: ["2023-01-01", "2023-11-30"]
  test: ["2024-01-01", "2025-12-31"]
  gap_months: 1                   # 1 month gap between splits to prevent label leakage
