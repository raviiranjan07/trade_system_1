backtest:
  start: '2025-01-01'
  end: '2025-12-31'
ml_v2_attention:
  inference:
    conf_long: 0.6
    conf_short: 0.58
  training:
    lr: 0.001
    batch_size: 2048
    max_epochs: 100
    patience: 10
    hidden: 128
    dropout: 0.5
    temperature: 0.5
    seed: 42
    conf_long: 0.6
    conf_short: 0.6
  split:
    train_start: '2020-01-01'
    train_end: '2023-12-31'
    val_start: '2024-01-01'
    val_end: '2024-12-31'
    test_start: '2025-01-01'
    test_end: '2025-12-31'
ml_v1:
  inference:
    conf_long: 0.6
    conf_short: 0.58   # validated 2024+2025 sweep: highest total bps both years
  training:
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 512
    max_epochs: 100
    patience: 10
    hidden: 128
    seed: 42
    conf_long: 0.6
    conf_short: 0.4
  split:
    train_start: '2020-01-01'
    train_end: '2023-12-31'
    val_start: '2024-01-01'
    val_end: '2024-12-31'
    test_start: '2025-01-01'
    test_end: '2025-12-31'
