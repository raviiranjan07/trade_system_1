# Model parameters — THE config for training/inference/splits.
# One block per model; block name = the model key used everywhere
# (training.train --model <key>, dvc params, orchestrator track name
# lowercased). DVC pins <key>.training/.split/.features/.inference per
# stage, MLflow logs them per run — a knob outside this file is
# invisible to both, so every experiment-variable value belongs here.
#
# Retired 3-model blocks: git history (pre 2026-07-12).

backtest:
  start: '2025-01-01'
  end: '2025-12-31'
  exit_version: v2

# ---------------------------------------------------------------
# Template — copy for the new model and fill in:
#
# my_model:
#   architecture: my_encoder        # training/architectures.py registry name
#   task: my_task                   # training/train.py TASKS name
#   features:
#     # every feature knob (windows, lookbacks, periods) — feature_lib
#     # formulas read these; train and live MUST share one variant
#   training:
#     lr: 0.001
#     batch_size: 512
#     max_epochs: 100
#     patience: 10
#     seed: 42
#   split:
#     train_start: '2020-01-01'
#     train_end: '2023-12-31'
#     val_start: '2024-01-01'
#     val_end: '2024-12-31'
#     test_start: '2025-01-01'
#     test_end: '2025-12-31'
#   inference:
#     conf_long: 0.6
#     conf_short: 0.6
#     exit_version: v2
#   sweep:
#     # grids for research/sweep_thresholds + sweep_training
# ---------------------------------------------------------------
