# ML V3 — Exit-Aware Direction Prediction
# LSTM+Attention with trade-outcome labels
# Predecessor: ML_V2_ATTENTION (binary direction, MFE heads, ±15 first-hit labels)

name: ML_V3
version: 1
status: DEVELOPMENT
created: 2026-04-18

# Architecture
architecture:
  type: LSTM + Attention + PnL regression + 3-class direction
  diagram: |
    Input [8 steps, 4 features]
      → LSTM(4→hidden, 1 layer) × 8 steps → 8 hidden states
      → Attention(hidden→1) × 8 → softmax/temperature → weights
      → Weighted sum → attended (hidden dims)
      → Dropout
      → h_long_pnl(hidden→1): predicted LONG trade profit
      → h_short_pnl(hidden→1): predicted SHORT trade profit
      → concat[attended + pred_long + pred_short]
      → h_dir(hidden+2 → 3) → softmax → [P(LONG), P(SHORT), P(SKIP)]

  layers:
    lstm:
      input_size: 4
      hidden_size: 128       # hyperparameter — sweep 64, 128, 180
      num_layers: 1
      bidirectional: false

    attention:
      type: single-head scaled dot
      score: Linear(hidden→1)
      temperature: 0.5       # hyperparameter — controls sharpness
      output: weighted sum of hidden states

    pnl_heads:
      h_long_pnl: Linear(hidden→1)
      h_short_pnl: Linear(hidden→1)
      target: actual trade net_profit_bps (simulated with V2 exit rules on 1m ticks)
      loss: MSE

    direction_head:
      input: concat[attended(hidden) + pred_long(1) + pred_short(1)]
      output: 3 logits → softmax → [P(LONG), P(SHORT), P(SKIP)]
      target: direction label derived from trade outcomes
      loss: CrossEntropy

# Key difference from V2
predecessor_comparison:
  ML_V2_ATTENTION:
    auxiliary_heads: h_mfe_up(128→8), h_mfe_down(128→8)
    auxiliary_target: raw MFE (max favorable excursion) — learned VOLATILITY
    direction_output: binary (LONG or SHORT)
    labels: "±15 bps first-hit within 8 bars" — ignores stop loss path
    problem: MFE heads teach LSTM about volatility not direction (91.7% ignored by h_dir)

  ML_V3:
    auxiliary_heads: h_long_pnl(128→1), h_short_pnl(128→1)
    auxiliary_target: actual trade P&L — learns TRADE OUTCOMES
    direction_output: 3-class (LONG, SHORT, SKIP)
    labels: simulated trade with real exit rules on 1m ticks
    improvement: labels encode stops, path, exit rules; model learns "is this worth trading?"

# Input features (same as V2 — no feature changes in V3)
features:
  type: diff features
  n_features: 32 (4 channels × 8 lookback steps)
  channels:
    - name: roc_diff
      formula: "(close[t] - close[t-n]) / close[t-n] × 10000"
      description: "Rate of change at lookback n (bps)"
    - name: rsi_diff
      formula: "rsi7[t] - rsi7[t-n]"
      description: "Change in RSI7 over n bars"
    - name: rp_diff
      formula: "range_position[t] - range_position[t-n]"
      description: "Change in range position (20-bar) over n bars"
    - name: sma200_diff
      formula: "sma200_dist_pct[t] - sma200_dist_pct[t-n]"
      description: "Change in SMA200 distance (%) over n bars"
  lookback_steps: [1, 2, 3, 4, 5, 6, 7, 8]
  reshaping: "32 flat → [8, 4] sequence for LSTM"
  scaling: z-score (mean/std from train set only)

# Labels
labels:
  type: exit-aware trade simulation
  source: build_exit_labels.py
  method: |
    For each 15m bar, simulate LONG and SHORT trades:
    1. Entry at next bar open
    2. Feed 1m ticks through V12PositionManager(exit_version="v2")
    3. Record net_profit_bps when exit rule fires
    4. Direction = LONG if long > 0 and long > short, SHORT if short wins, SKIP if both lose
  exit_rules: V2 (PT_TARGET 80, PT_LOCK 60, MID_TRAIL 25/10, STOP_LOSS -10, TIME_EXIT bar 6)
  fees: 8 bps round-trip
  columns: long_net_bps, short_net_bps, long_exit_reason, short_exit_reason, direction
  expected_distribution: "~25% LONG, ~25% SHORT, ~50% SKIP"

# Training
training:
  data_split:
    method: date-based (strict temporal, no leakage)
    train: "2020-01-01 to 2023-12-31"
    val: "2024-01-01 to 2024-12-31"
    test: "2025-01-01 to 2025-12-31"
    gap: 1 month between splits
  loss: "MSE(long_pnl) + MSE(short_pnl) + CrossEntropy(direction)"
  loss_weights: "1.0 : 1.0 : 1.0 (equal — unlike V2 which had 4:1 MFE:direction)"
  optimizer: Adam
  scheduler: ReduceLROnPlateau (patience=5, factor=0.5)
  early_stopping: patience=10 on val loss
  seeds: [42, 43, 44] (3 runs for stability)
  gradient_clipping: 1.0

# Hyperparameters
hyperparameters:
  hidden_size: {default: 128, sweep: [64, 128, 180]}
  dropout: {default: 0.5, sweep: [0.3, 0.5]}
  temperature: {default: 0.5, sweep: [0.3, 0.5, 0.7]}
  lr: {default: 0.001, sweep: [0.0005, 0.001]}
  batch_size: {default: 2048, sweep: [1024, 2048]}
  max_epochs: 100
  patience: 10
  loss_weight_pnl: {default: 1.0, sweep: [0.5, 1.0, 2.0]}
  loss_weight_dir: {default: 1.0, sweep: [0.5, 1.0, 2.0]}

# Inference
inference:
  input: "[1, 8, 4] float32 tensor (scaled diff features)"
  output: "[P(LONG), P(SHORT), P(SKIP)] + pred_long_pnl + pred_short_pnl"
  signal_generation: |
    If P(LONG) > conf_long → fire ML_V3_LONG
    If P(SHORT) > conf_short → fire ML_V3_SHORT
    Otherwise → no signal
  thresholds: "conf_long and conf_short from configs/params.yaml ml_v3.inference"
  runtime: ONNX (CPU)

# Performance (filled after training)
performance:
  accuracy: TBD
  confident_accuracy: TBD
  n_confident_signals: TBD
  backtest:
    total_bps: TBD
    profit_factor: TBD
    stop_rate: TBD
    max_dd: TBD

# Baseline comparison
baseline:
  model: ML_V2_ATTENTION
  exit: V2 (no LOCKED_PROFIT)
  period: 2024-2025 OOS
  metrics:
    total_bps: 10129
    profit_factor: 2.28
    stop_rate: 50.4%
    max_dd: -367

# Known limitations
limitations:
  - Labels coupled to V2 exit rules — must regenerate if exits change
  - Same 32 diff features as V2 — no new information sources yet
  - ~50% SKIP labels may cause class imbalance issues
  - LSTM may not use sequential structure (MLP ≥ LSTM from L2-003)
  - Single-head attention may miss multi-aspect patterns

# Future improvements (if V3 works)
future:
  - Add volume features (exhaustion vs continuation signal)
  - Add multi-timeframe context (1H/4H trend)
  - Test MLP vs LSTM on exit-aware labels
  - Multi-head attention
  - RL for dynamic exits (once entry signals improved)

# Files
files:
  training: src/engine/train_v3.py
  labels: src/engine/build_exit_labels.py
  signal_generator: src/engine/signals/ml_v3.py
  model_output: models/ML_V3_staging/
  protocol: configs/protocols/direction_prediction_v3.yaml
  data_card: configs/data_cards/exit_aware_labels.yaml
