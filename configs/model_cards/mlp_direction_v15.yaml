# Model Card: V1.5 Direction Prediction MLP
# Production model deployed 2026-03-19. Paper trading on live bot.

name: mlp_direction_v15
version: 1
created: 2026-03-01
status: DEPLOYED (production, paper trading since 2026-03-19)
protocol: direction_prediction_v1
data_card: l2_003_feature_cache

# ============================================================
# What the model does
# ============================================================
purpose: |
  Predicts whether BTC price will move UP or DOWN by ±15bps first
  within the next 96 bars (24 hours) on 15-min timeframe.
  Used to generate ML_LONG and ML_SHORT signals for the trading bot.

prediction:
  type: binary classification
  output: single float (0 to 1 via sigmoid)
  interpretation:
    "> 0.60": "LONG signal — price likely hits +15bps first"
    "< 0.35": "SHORT signal — price likely hits -15bps first"
    "0.35 to 0.60": "SKIP — not confident enough to trade"
  label_column: "direction (H96) from labels.parquet"
  label_encoding: "LONG=0 in parquet → y_binary=1.0 in training"
  classes_used: "LONG and SHORT only (BOTH and SKIP filtered out)"
  note: |
    Production uses H96 (direction column), NOT H8 (direction_h8).
    Research experiments (Stage 3-4) used H8.
    Production retrained on H96 for better backtest (+6,096 vs +3,815 bps).

# ============================================================
# Architecture
# ============================================================
architecture:
  type: MLP (Multi-Layer Perceptron)
  class_name: MLPBinaryDir
  source_file: src/v12/ml_train.py

  layers:
    - name: fc1
      type: Linear
      input_dim: 10
      output_dim: 128
      activation: ReLU
      purpose: "Project 10 features into 128-dim hidden representation"

    - name: fc2
      type: Linear
      input_dim: 128
      output_dim: 128
      activation: ReLU
      purpose: "Learn feature interactions and non-linear patterns"

    - name: out
      type: Linear
      input_dim: 128
      output_dim: 1
      activation: none (sigmoid applied in loss function)
      purpose: "Output single direction score"

  total_params: 17537
  dropout: "0.5 passed to constructor but NEVER applied in forward() — effectively 0.0"

  diagram: |
    Input (10 features)
         │
         ▼
    Linear(10 → 128) + ReLU
         │
         ▼
    Linear(128 → 128) + ReLU
         │
         ▼
    Linear(128 → 1)
         │
         ▼
    Sigmoid → probability (0 to 1)
         │
         ├── > 0.60 → LONG
         ├── < 0.35 → SHORT
         └── else   → SKIP

# ============================================================
# Input features
# ============================================================
input:
  n_features: 10
  shape: [10]
  note: "Despite feature_cache having 23 features (cleaned from 1,266), only 10 are used."

  features:
    roc1:
      description: "Rate of change, 1-bar lookback (bps)"
      computed: "(close[t] - close[t-1]) / close[t-1] * 10000"
      signal_share: "roc1 + roc2 together carry 45% of directional signal"

    roc2:
      description: "Rate of change, 2-bar lookback (bps)"
      computed: "(close[t] - close[t-2]) / close[t-2] * 10000"

    roc3:
      description: "Rate of change, 3-bar lookback"

    roc4:
      description: "Rate of change, 4-bar lookback"

    roc5:
      description: "Rate of change, 5-bar lookback"

    roc6:
      description: "Rate of change, 6-bar lookback"

    roc7:
      description: "Rate of change, 7-bar lookback"

    roc8:
      description: "Rate of change, 8-bar lookback (2 hours)"

    range_position_50:
      description: "Where price sits in the 50-bar high-low range (0=at low, 1=at high)"
      computed: "(close - lowest_low_50) / (highest_high_50 - lowest_low_50)"
      signal_share: "17% of directional signal"
      note: "50-bar window, NOT 20-bar. Computed fresh in ml_train.py, not from feature_cache."

    rsi7:
      description: "7-period RSI (0-100)"
      signal_share: "6% of directional signal"

  normalization:
    method: z-score
    fit_on: "ALL data 2020-2025 (production). Research used train-only 2020-2023."
    note: "Scaler saved to models/direction_v15/scaler.npz. Same scaler applied at inference."

# ============================================================
# Data usage (exact columns read from each file)
# ============================================================
data_usage:
  feature_cache:
    path: data/features/direction_prediction/feature_cache.parquet
    columns_read: [close, high, low]
    columns_used_from_cache: 3 of 23
    feature_processing: |
      Reads close, high, low. Computes fresh at training time:
        roc1-8: (close[t] - close[t-N]) / close[t-N] * 10000  (8 features)
        range_position_50: (close - low_50) / (high_50 - low_50)  (1 feature, 50-bar window)
        rsi7: 7-period RSI from close  (1 feature)
      Total: 10 features, none stored in feature_cache

  labels:
    path: data/features/direction_prediction/labels.parquet
    columns_read: [direction]
    columns_used_from_labels: 1 of 30
    label_processing: |
      Reads direction (H96). Filters to LONG=0 and SHORT=1 only.
      Maps LONG=0 → y_binary=1.0, SHORT=1 → y_binary=0.0 (inverted encoding).
      BOTH and SKIP excluded from training.
    not_used: "29 of 30 columns (all MFE, H8 direction, timing, expansion)"

  key_differences_from_research_models:
    range_position: "50-bar (this model) vs 20-bar (LSTM/Attention/Curriculum)"
    direction_label: "H96 (this model) vs H8 (LSTM/Attention/Curriculum)"
    sma200_dist_pct: "NOT used (this model) vs used as 4th diff feature (LSTM/Attention/Curriculum)"
    mfe_heads: "NONE (this model) vs connected MFE H1-H8 (LSTM/Attention/Curriculum)"

# ============================================================
# Training
# ============================================================
training:
  framework: PyTorch
  hardware: Google Colab T4 GPU (training), CPU (inference/bot)
  optimizer: Adam
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  scheduler: "ReduceLROnPlateau(patience=5, factor=0.5)"
  batch_size: 512
  max_epochs: 100
  early_stopping:
    patience: 10
    monitor: val_loss
  loss: BCEWithLogitsLoss (binary cross-entropy)
  class_weights: none
  seed: 42

  data_split:
    production:
      method: "random 90/10 split from ALL data 2020-2025"
      train: "90% of all LONG+SHORT bars (random)"
      val: "10% of all LONG+SHORT bars (random)"
      test: "none — no held-out test in production"
      note: "Production trains on ALL available data for best predictions."
    research:
      method: "date-based split"
      train: "2020-01-01 to 2023-12-31"
      val: "2024-01-01 to 2024-06-30"
      test: "2025-01-01 to 2025-12-31"
      note: "Research used date-based split for honest evaluation."

# ============================================================
# Performance
# ============================================================
performance:
  overall:
    test_confident_accuracy: "57-58%"
    confidence_threshold_long: 0.60
    confidence_threshold_short: 0.35
    note: "Accuracy measured only on confident bars (prob > 0.60 or < 0.35)"

  backtest_2024_2025:
    total_trades: 439
    total_bps: "+11,096"
    profit_factor: 2.44
    ml_long: "220 trades, 73.6% win, +7,035 bps"
    ml_short: "219 trades, varies"

  paper_trading:
    start_date: "2026-03-19"
    as_of: "2026-03-24"
    trades: 4
    results: "3W 1L, +140.5 bps, wallet $5 → $6.98"

  per_split:
    train_accuracy: "~65%"
    val_accuracy: "~58%"
    test_accuracy: "~57%"

  required_metrics_status: |
    26 metrics required by direction_prediction_v1 protocol.
    Currently only overall accuracy is documented.
    Per-class metrics (n_confident_long/short, confident_accuracy_long/short,
    MFE/MAE per class, long_short_ratio) need a model re-run through
    run_experiment() to compute. PENDING.

# ============================================================
# What the model learned (key findings)
# ============================================================
what_it_learned:
  - "roc1 + roc2 carry 45% of directional signal — recent momentum dominates"
  - "range_position_50 carries 17% — where price sits in recent range matters"
  - "rsi7 carries 6% — overbought/oversold has weak but real signal"
  - "Remaining 32% spread across roc3-roc8 — diminishing returns at longer lookbacks"

what_it_cannot_learn:
  - "Direction beyond 57-58% — OHLCV features lack asymmetric information"
  - "95.7% of bars have opposite-direction twin (same features, opposite outcome)"
  - "Temporal signal adds only 1-2% — LSTM/GRU don't help because indicators already encode time"

# ============================================================
# CRITICAL: No magnitude modeling in production
# ============================================================
magnitude_gap:
  description: |
    The V1.5 production model has NO explicit magnitude modeling.
    It is a simple 10→128→128→1 MLP with direction-only output.
    No MFE prediction heads. No connected architecture.

    The research models (LSTM, Attention, Curriculum) all used a
    CONNECTED MULTI-TASK architecture where:
      1. MFE UP head predicts "how far will price move up?" (8 horizons)
      2. MFE DOWN head predicts "how far will price move down?" (8 horizons)
      3. Direction head sees hidden_state + MFE_UP + MFE_DOWN predictions
      → Direction decision is INFORMED by magnitude predictions

    The production MLP dropped this entirely. It only predicts direction
    from 10 momentum features, with no internal magnitude awareness.

  research_architecture: |
    hidden → MFE_UP(8) → ─┐
    hidden → MFE_DOWN(8) → ├─► Direction head sees magnitude internally
    hidden ─────────────── ┘

  production_architecture: |
    10 features → 128 → 128 → 1 direction score
    (no MFE heads, no magnitude, no connected architecture)

  implication: |
    The claim "confidence threshold IS the magnitude gate" is UNVERIFIED.
    High confidence might correlate with high magnitude (because extreme
    momentum = extreme features = confident prediction), but this is an
    assumption, not a designed feature of the architecture.

    If magnitude matters for trade quality, the production model may be
    leaving value on the table by not modeling it explicitly.

# ============================================================
# Other architectures tested (same data, same label)
# ============================================================
alternatives_tested:
  lstm_gru:
    result: "Same 57-58%. Memory doesn't help for indicator features."
    reason: "Indicators already encode temporal info. LSTM adds redundant memory."

  lightgbm_11178col:
    result: "97.9% train, 50.5% OOS. Massive overfit."
    reason: "Flattened 9 snapshots, lost time order. Too many features."

  attention_temp005:
    result: "58.8% (best ever) but only 816 confident bars"
    reason: "Sharp attention finds slightly better patterns but trades too rarely"

  curriculum_learning:
    result: "54.9-57.6%. Easy patterns unlearned when noise added."

  separate_encoders:
    result: "56.5%. Same input produces same encoder outputs."

  asymmetry_loss:
    result: "57.1%. Custom penalty doesn't create signal that doesn't exist."

# ============================================================
# Known issues and caveats
# ============================================================
caveats:
  - "57-58% accuracy is barely above random (50%). Not reliable as standalone signal."
  - "Works best as a FILTER on V1.3.2: ML agrees = 62.9% win, disagrees = 48.9%."
  - "Production trained on ALL data 2020-2025. No held-out test set."
  - "Only tested on BTCUSDT 15-min. Not validated on other assets or timeframes."
  - "Paper trading sample is tiny (4 trades as of Mar 24). Not statistically significant."
  - "sma200_dist_pct had a NaN contamination bug that was fixed — model was retrained after fix."
  - "26 required protocol metrics not yet computed — needs re-run through run_experiment()."
