  - experiments/exit_strategy/bar_sweep/: time exit bar optimization (bar 6 winner)
  - experiments/exit_strategy/pt_target_sweep/: PT_TARGET 80-150 sweep
  - experiments/exit_strategy/pt_trail/: PT trailing test (rejected)
  - experiments/exit_strategy/v3_plus_stop30/: STOP_LOSS sweep (found -10 optimal)

