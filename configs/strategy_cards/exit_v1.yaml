# Implementation status
implementation:
  live_in_production: full
  deployed_tag: v1.10.x
  deployed_model: V1.4 + ML V1.5 + ML V2 Attention (all three on V1)
  rules_live: [pt_target, pt_lock, mid_trail, locked_profit, stop_loss, no_zone, time_exit]
  rules_pending: []
  requires:
    - Real-time tick monitoring via WebSocket (already built)
    - on_tick() method (already built)
    - Stop-limit orders on Binance for real live trading (future work)
  reference_script: experiments/exit_strategy/v3_plus_stop30/run_experiment.py

# Known limitations
limitations:
  - PT_LOCK, MID_TRAIL, STOP_LOSS use idealized back-calculated exit prices
  - Real Binance fills have 1-5 bps slippage; real-world numbers will be lower
  - Stop -10 may be too tight with real slippage (-10 stop + 5 bps slip = -15 effective)
  - No re-entry rules in V1 yet
  - Only tested on V1.5 and Attention with H8 label; not validated on future models

# Tested on
tested_on:
  dataset: data/raw/BTCUSDT_15m_ohlcv.parquet + data/raw/BTCUSDT_1m_ohlcv.parquet
  timeframe: 15m signals + 1m exit monitoring
  asset: BTCUSDT
  train_period: 2020-2023 (model training)
  test_period: 2024-2025 (OOS)
  data_card: configs/data_cards/btcusdt_15m_ohlcv.yaml

