name: exit_v1
version: 3
status: LIVE (all tick rules deployed; sole exit plan after V2 removal in v1.10.x)
description: |
  Third-generation exit strategy. Complete tiered exit system with 6 tick rules
  plus bar-close backstop:
    1. PROFIT_TARGET  — take profit at 80 bps (arm at peak 60)
    2. PT_LOCK        — profit lock at 60 bps (arm at peak 60)
    3. MID_TRAIL      — trail 10 bps from peak (arm at peak 25)
    4. LOCKED_PROFIT  — static exit at 15 bps (arm at peak 15)
    5. STOP_LOSS      — hard cap at -10 bps
    6. NO_ZONE/TIME_EXIT — bar 6 backstop (split by pnl sign)

  Uses IDEALIZED stop-order simulation for PT_LOCK, MID_TRAIL, STOP_LOSS
  (assumes stop-limit orders on Binance fill at the designated level).

  Validated on V1.5 MLP, Attn 0.40, Attn 0.35 — all profitable with complete V1.

# Rules (priority order per tick)
rules:
  pt_target:
    description: Take profit at 80 when price ran from 60
    activation: peak_mfe >= 60 AND bars_held <= 5
    trigger: tick_pnl >= 80
    exit_at: current tick price (can gap above 80)

  pt_lock:
    description: Stop order at 60 bps once peak touched 60
    activation: peak_mfe >= 60 AND bars_held <= 5
    trigger: tick_pnl <= 60
    exit_at: IDEALIZED 60 bps (stop-limit simulation)

  mid_trail:
    description: Dynamic trailing stop for mid-range winners
    activation: peak_mfe >= 25 AND NOT pt_armed
    trigger: drawdown (peak - tick_pnl) >= 10
    exit_at: IDEALIZED peak - 10 bps (stop-limit simulation)

  locked_profit:
    description: Static profit lock for small winners
    activation: peak_mfe >= 15
    trigger: tick_pnl <= 15
    exit_at: current tick price

  stop_loss:
    description: Hard stop loss (part of V1 core — pending deployment)
    activation: always (from entry)
    trigger: tick_pnl <= -10
    exit_at: IDEALIZED -10 bps (stop-market simulation)
    recommended_bps: -10    # best in backtest sweep
    alternate: {-15, -20}   # safer if real slippage > 2 bps

  no_zone:
    description: Bar-6 exit when pnl is above entry but below LP trigger
    activation: bars_held >= 6
    trigger: bar_close_pnl >= 0
    exit_at: bar close

  time_exit:
    description: Bar-6 exit when pnl below entry (rarely fires with stop loss)
    activation: bars_held >= 6
    trigger: bar_close_pnl < 0
    exit_at: bar close

# Parameters (current production values)
parameters:
  pt_arm_bps: 60
  pt_target_bps: 80
  pt_lock_bps: 60
  pt_max_bar: 5
  mid_trail_arm_bps: 25
  mid_trail_width_bps: 10
  lock_arm_bps: 15
  lock_trigger_bps: 15
  stop_loss_bps: -10     # core V1 rule
  max_bars: 6

# What V1 REMOVES from V2
removed:
  - early_cut_bar3_mfe    # V2: cut if MFE < 3 at bar 3
  - early_cut_bar4_mfe    # V2: cut if MFE < 5 at bar 4
  - breakeven_activation  # V2: BE lock at MFE >= 15
  - breakeven_floor       # V2: floor 9 bps gross
  - tighten_after_bar     # V2: tighten to 6 bps at bar 4+
  - tight_trailing_stop   # V2: 6 bps trailing
  - wide_trailing_stop    # V1/V2: 20/30 bps trailing

