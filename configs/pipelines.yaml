# Pipeline manifest: which DVC stages belong to each model.
# Used by scripts/mlops/run_pipeline.py so humans can say "run my_model"
# instead of typing every stage name.
#
# STAGE NAMES MUST MATCH dvc.yaml EXACTLY — dvc repro fails on unknown
# stages. When adding a new model, append a block with its stage list.
#
# Template:
# my_model:
#   description: one-line description of the model
#   stages:
#     - build_features
#     - build_exit_labels        # if the model uses exit-aware labels
#     - verify_exit_labels
#     - train_my_model
#     - verify_my_model
#     - backtest_my_model
