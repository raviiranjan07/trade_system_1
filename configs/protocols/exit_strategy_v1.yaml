name: exit_strategy_v1
version: 1
description: |
  Evaluate exit rules for 15-min BTCUSDT trades.
  Entry signals are fixed (V1.4 / ML V1.5 / ML V2) — only exit logic varies.
  Rule-based strategy, no ML training involved.

test_spec:
  type: rule_based
  entry: fixed
  variable: exit_rules

data_split:
  train: ["2020-01-01", "2023-12-31"]
  test: ["2024-01-01", "2025-12-31"]
  asset: BTCUSDT
  timeframe: 15m
  secondary_timeframe: 1m    # if testing real-time monitoring

required_metrics:
  # Core performance
  - total_bps
  - profit_factor
  - win_rate
  - max_drawdown_bps
  - n_trades
  - avg_bps_per_trade
  # Exit type breakdown (V1 rules)
  - pt_target_count
  - pt_target_bps
  - pt_lock_count
  - pt_lock_bps
  - mid_trail_count
  - mid_trail_bps
  - locked_profit_count
  - locked_profit_bps
  - stop_loss_count
  - stop_loss_bps
  - time_exit_count
  - time_exit_bps
  - no_zone_count
  - no_zone_bps
  # Winner/loser analysis
  - avg_winner_bps
  - avg_loser_bps
  - avg_hold_bars
  - avg_mfe_bps
  - avg_mae_bps
  # Consistency
  - per_year_bps
  - per_signal_type_bps

optional_metrics:
  - loss_conversion_rate
  - per_quarter_bps
  - sharpe_daily

required_artifacts:
  - trades.csv
  - metrics.json
  - comparison.md

baseline:
  name: exit_v1
  description: |
    V1 exit (current production, was V3 pre-rename): PT_TARGET at 80,
    PT_LOCK at 60 (stop order), MID_TRAIL arm 25 trail 10 (stop order),
    LOCKED_PROFIT 15 static, STOP_LOSS -10, bar 6 TIME_EXIT/NO_ZONE split.
    OOS (2024-2025, V1.5 MLP): +4,026 bps, PF 1.14, DD -1,731 (honest tick)
  historical:
    exit_v0_retired_trailing:
      description: LONG 20bps TS, SHORT 30bps TS, tighten 8bps after bar 5, bar 10 time exit
      metrics: {total_bps: -3901, profit_factor: 0.88, max_drawdown_bps: -4474, note: "honest tick backtest"}
    exit_v2:
      description: Early cut bar3/4, tighten bar4 6bps, BE lock MFE>=15 floor 9g, bar 10 exit
      metrics: {total_bps: 33062, profit_factor: 4.66, max_drawdown_bps: -276, note: "theoretical backtest (buggy exit pricing)"}
      honest_metrics: {total_bps: -4822, profit_factor: 0.86, note: "with honest bar-close pricing"}

configurable_params:
  - v1_pt_arm_bps
  - v1_pt_target_bps
  - v1_pt_lock_bps
  - v1_pt_max_bar
  - v1_mid_trail_arm_bps
  - v1_mid_trail_width_bps
  - v1_lock_arm_bps
  - v1_lock_trigger_bps
  - v1_stop_loss_bps
  - v1_max_bars
  - monitoring_resolution      # 15m or 1m

tags:
  layer: 0
  category: exit_strategy
  asset: BTCUSDT
  timeframe: 15m
