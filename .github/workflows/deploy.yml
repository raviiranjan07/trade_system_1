name: Build & Deploy to EC2

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trade-system:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/trade-system:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            # Pull latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/trade-system:latest

            # Stop old container if running
            docker stop trade-bot 2>/dev/null || true
            docker rm trade-bot 2>/dev/null || true

            # Run new container
            docker run -d \
              --name trade-bot \
              --restart unless-stopped \
              -p 8080:8080 \
              -v /home/${{ secrets.EC2_USER }}/trading_bot/trade-data:/app/data \
              --env-file /home/${{ secrets.EC2_USER }}/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/trade-system:latest

            # Clean up old images
            docker image prune -f
